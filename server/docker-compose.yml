services:
  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: sing-box-node
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - TZ=UTC
    volumes:
      - ./sing-box:/etc/sing-box:ro
      - ./certs:/etc/sing-box/certs:ro
      - ./logs:/var/log/sing-box
    command: -D /var/lib/sing-box -C /etc/sing-box run
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
